name: Read mobile browser CI

on:
  pull_request:
    paths:
      - "apps/ios/FloentlyRead/**"
      - "apps/ios/FloentlyShared/**"
      - "apps/android/FloentlyRead/**"
      - "apps/android/shared/**"
      - "apps/android/settings.gradle.kts"
      - "apps/android/build.gradle.kts"
      - "docs/READ_MOBILE_BROWSER_COMPATIBILITY_0330.md"
      - "docs/design/READ_MOBILE_BROWSER_UX_SPEC_0330.md"
      - "scripts/validate_read_mobile_browser_0330.sh"
      - ".github/workflows/read-mobile-browser-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/ios/FloentlyRead/**"
      - "apps/ios/FloentlyShared/**"
      - "apps/android/FloentlyRead/**"
      - "apps/android/shared/**"
      - "apps/android/settings.gradle.kts"
      - "apps/android/build.gradle.kts"
      - "docs/READ_MOBILE_BROWSER_COMPATIBILITY_0330.md"
      - "docs/design/READ_MOBILE_BROWSER_UX_SPEC_0330.md"
      - "scripts/validate_read_mobile_browser_0330.sh"
      - ".github/workflows/read-mobile-browser-ci.yml"

permissions:
  contents: read

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate universal mobile browser contracts
        run: bash scripts/validate_read_mobile_browser_0330.sh

  android-read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Floently Read Android debug APK
        working-directory: apps/android
        run: gradle :FloentlyRead:app:assembleDebug --no-daemon --stacktrace

  ios-read:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Floently Read Xcode project
        working-directory: apps/ios/FloentlyRead
        run: xcodegen generate
      - name: Build Floently Read for iPhone simulator
        working-directory: apps/ios/FloentlyRead
        run: >-
          xcodebuild
          -project FloentlyRead.xcodeproj
          -scheme FloentlyRead
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
