name: FloentlyRead
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FloentlyShared:
    path: ../FloentlyShared
targets:
  FloentlyRead:
    type: application
    platform: iOS
    sources:
      - path: FloentlyRead
        excludes:
          - Info.plist
          - FloentlyRead.entitlements
          - Assets.xcassets/AppIcon.appiconset/FloentlyRead-1024.png.base64.txt
          - Assets.xcassets/AppIcon.appiconset/FloentlyRead-1024.png.b64
          - Assets.xcassets/AppIcon.appiconset/README.txt
          - Assets.xcassets/AppIcon.appiconset/.binary-icon-note
    dependencies:
      - package: FloentlyShared
    preBuildScripts:
      - name: Materialize Floently Read app icon
        script: |
          ICON_DIR="$SRCROOT/FloentlyRead/Assets.xcassets/AppIcon.appiconset"
          ICON_B64="$ICON_DIR/FloentlyRead-1024.png.b64"
          ICON_PNG="$ICON_DIR/FloentlyRead-1024.png"
          if [ -f "$ICON_B64" ]; then
            /usr/bin/base64 -D -i "$ICON_B64" -o "$ICON_PNG"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitusidi.floently.read
        PRODUCT_NAME: FloentlyRead
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: FloentlyRead/FloentlyRead.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FloentlyRead/Info.plist
      properties:
        CFBundleDisplayName: Floently Read
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.vitusidi.floently.read
            CFBundleURLSchemes:
              - floentlyread
        NSCameraUsageDescription: Floently Read only requests camera access when the website you are using asks for it.
        NSMicrophoneUsageDescription: Floently Read only requests microphone access when the website you are using asks for it.
        NSPhotoLibraryUsageDescription: Floently Read only requests photo access when a website file picker asks you to choose media.
